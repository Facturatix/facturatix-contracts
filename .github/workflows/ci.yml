# ═══════════════════════════════════════════════════════════════════════════════
# Facturatix Contracts — CI/CD Pipeline (NuGet + npm)
# ═══════════════════════════════════════════════════════════════════════════════
#
# DESCRIPTION
# ───────────
# Builds, verifies and publishes the two halves of the platform contract:
#
#   • Facturatix.Contracts   → NuGet  (nuget.pkg.github.com/Facturatix)
#   • @facturatix/contracts  → npm    (npm.pkg.github.com)
#
# Both carry the SAME `schemas/` directory and the SAME version number, published
# from the same commit. That is the point: "which contract are we on" has to have
# one answer in .NET and in Node, or the tri-stack gate in the consumers compares
# two different documents and calls the agreement meaningful.
#
# THE PARITY JOB IS THE PRODUCT
# ─────────────────────────────
# The build job runs the C# validator and the TypeScript validator over the same
# fixture corpus and requires both to reproduce the manifest — same verdict, same
# validation codes, same RFC 8785 canonical hash. Publishing a package whose two
# implementations disagree would ship a contract that is not one contract.
#
# TRIGGERS
# ────────
# • Push to `main`         → Build + verify + publish both packages
# • Pull request to `main` → Build + verify only
# • workflow_dispatch      → Manual publish with optional version suffix
#
# VERSIONING
# ──────────
# The .csproj <Version> is the source of truth; the build fails if package.json
# disagrees with it.
#
# ═══════════════════════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Version suffix (e.g., beta.1). Leave empty for release version."
        required: false
        type: string

env:
  DOTNET_VERSION: "10.0.x"
  PACKAGE_PROJECT: src/Facturatix.Contracts/Facturatix.Contracts.csproj

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: Build & Validate — both ecosystems, plus cross-stack parity
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # ─── Version parity ─────────────────────────────────────────────────
      # A NuGet package and an npm package that claim to be the same contract but
      # carry different version numbers cannot be reasoned about downstream.
      - name: Verify NuGet and npm versions match
        run: |
          CS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' ${{ env.PACKAGE_PROJECT }})
          NPM_VERSION=$(node -p "require('./package.json').version")
          echo "csproj=$CS_VERSION package.json=$NPM_VERSION"
          if [ "$CS_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Version mismatch: csproj is $CS_VERSION but package.json is $NPM_VERSION"
            exit 1
          fi

      # ─── .NET ───────────────────────────────────────────────────────────
      - name: Restore .NET dependencies
        run: dotnet restore ${{ env.PACKAGE_PROJECT }}

      - name: Build .NET package
        run: dotnet build ${{ env.PACKAGE_PROJECT }} --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Pack (dry run)
        run: dotnet pack ${{ env.PACKAGE_PROJECT }} --no-build --configuration Release --output ./nupkg

      # ─── Node ───────────────────────────────────────────────────────────
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build npm package
        run: pnpm run build

      # ─── Cross-stack parity (the gate this repository exists for) ───────
      - name: Verify the manifest is regenerable from the C# implementation
        run: |
          dotnet run --project tools/generate-manifest -- schemas/fixtures
          if ! git diff --quiet -- schemas/fixtures/manifest.json; then
            echo "::error::schemas/fixtures/manifest.json is stale. Regenerate it with 'dotnet run --project tools/generate-manifest -- schemas/fixtures' and commit the result."
            git --no-pager diff -- schemas/fixtures/manifest.json
            exit 1
          fi

      - name: Verify the TypeScript implementation reproduces the manifest
        run: node scripts/verify-contract-parity.mjs

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2: Publish — one commit, both registries
  # ═══════════════════════════════════════════════════════════════════════════
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # Only publish on push to main or manual dispatch (not on PRs)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: "@facturatix"
          cache: pnpm

      # Determine the version once and use it for both registries.
      - name: Determine version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' ${{ env.PACKAGE_PROJECT }})
          SUFFIX="${{ inputs.version_suffix }}"
          if [ -n "$SUFFIX" ]; then
            FULL_VERSION="${VERSION}-${SUFFIX}"
          else
            FULL_VERSION="$VERSION"
          fi
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "## 📦 Contract version: $FULL_VERSION" >> $GITHUB_STEP_SUMMARY

      # ─── NuGet ──────────────────────────────────────────────────────────
      - name: Pack NuGet
        run: |
          dotnet pack ${{ env.PACKAGE_PROJECT }} \
            --configuration Release \
            --output ./nupkg \
            /p:PackageVersion=${{ steps.version.outputs.version }} \
            /p:ContinuousIntegrationBuild=true

      - name: Push to GitHub Packages (NuGet)
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/Facturatix/index.json" \
            --skip-duplicate

      # ─── npm ────────────────────────────────────────────────────────────
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build npm package
        run: pnpm run build

      # `--no-git-checks`: the version is stamped in place from the csproj, so the
      # working tree is intentionally dirty at this point.
      - name: Publish to GitHub Packages (npm)
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version
          pnpm publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Both halves published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ecosystem | Package | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| NuGet | \`Facturatix.Contracts\` | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| npm | \`@facturatix/contracts\` | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
